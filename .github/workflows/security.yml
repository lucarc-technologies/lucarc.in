name: Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Run weekly on Mondays at 04:00 UTC

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Audit Dependencies for High/Critical Vulnerabilities
        run: npm audit --audit-level=high --dry-run
