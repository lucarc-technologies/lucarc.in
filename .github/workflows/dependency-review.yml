name: Dependency Review

on:
  pull_request:
    branches: ["main"]
    paths:
      - "package*.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
