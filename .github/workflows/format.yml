name: Format Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.{ts,tsx,css,json,md}"

jobs:
  format-check:
    name: Code Formatting Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Verify ESLint Formatting Rules
        run: npm run lint
